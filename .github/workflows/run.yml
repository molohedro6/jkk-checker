name: JKK Auto Checker

on:
  schedule:
    # 毎時00分（日本時間の毎時00分）に自動実行
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタンも用意

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4   # v3 から v4 へ変更

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5  # v4 から v5 へ変更

      - name: ライブラリとPlaywrightブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: スクリプトの実行
        run: python main.py
