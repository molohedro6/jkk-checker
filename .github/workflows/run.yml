name: JKK Auto Checker

on:
  schedule:
    # 日本時間 9:00〜17:30（UTC 0:00〜8:30）の30分おき
    - cron: '0,30 0-8 * * *'
    # 日本時間 18:00（UTC 9:00）の最終実行
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリとPlaywrightブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: スクリプトの実行
        run: python main.py

      - name: 履歴ファイルをリポジトリへ自動保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_properties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen properties" && git push)
