name: JKK Auto Checker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: Playwrightブラウザのインストール
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: スクリプトの実行
        env:
          JKK_USER_ID: ${{ secrets.JKK_USER_ID }}
          JKK_USER_PASS: ${{ secrets.JKK_USER_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python main.py

      - name: 履歴ファイルをリポジトリへ自動保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_properties.json
          if git diff --staged --quiet; then
            echo "変更がないため保存をスキップします"
          else
            git commit -m "Update seen properties"
            git push origin HEAD
          fi
