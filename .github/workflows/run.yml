name: JKK Auto Checker

on:
  schedule:
    # 日本時間 9:13〜17:43（UTC 0:13〜8:43）の30分おき（混雑回避）
    - cron: '13,43 0-8 * * *'
    # 日本時間 18:13（UTC 9:13）の最終実行
    - cron: '13 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwrightブラウザのキャッシュ設定
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: システム依存ライブラリのインストール
        run: playwright install-deps chromium

      - name: Playwrightブラウザのダウンロード（キャッシュがない時のみ）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: スクリプトの実行
        env:
          JKK_USER_ID: ${{ secrets.JKK_USER_ID }}
          JKK_USER_PASS: ${{ secrets.JKK_USER_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python main.py

      - name: 履歴ファイルをリポジトリへ自動保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_properties.json
          if git diff --staged --quiet; then
            echo "変更がないため保存をスキップします"
          else
            git commit -m "Update seen properties"
            git push origin HEAD
          fi
