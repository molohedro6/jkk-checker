name: JKK Auto Checker

on:
  schedule:
    # 毎時00分に自動実行
    - cron: '0 * * * *'
  workflow_dispatch:

# GitHubへの自動書き込み権限を付与
permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリとPlaywrightブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: スクリプトの実行
        run: python main.py

      - name: 履歴ファイルをリポジトリへ自動保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_properties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen properties" && git push)
